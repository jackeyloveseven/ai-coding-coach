name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows has produced real bugs here (python3 being the Store stub,
        # stdout encoding), so run both platforms rather than letting it rot
        # silently.
        os: [ubuntu-latest, windows-latest]

    env:
      # PLAN files may hold non-ASCII text, and both the test scripts and the code
      # under test write to stdout. On an English-locale Windows (which is what
      # the windows-latest runner is) Python defaults to cp1252, which can't encode
      # it and raises UnicodeEncodeError. (On a Chinese-locale machine the default
      # is cp936, which mangles it without crashing.)
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Progress reader, generic.py
        working-directory: exptool
        run: python tests/test_generic.py

      - name: exp command (local mode)
        working-directory: exptool
        shell: bash
        run: bash tests/test_exp.sh
